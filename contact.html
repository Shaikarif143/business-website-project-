<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — Creative Studio</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <h1 class="logo"><a href="index.html">Creative Studio</a></h1>
      <nav>
        <ul class="nav">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="contact.html" class="active cta">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container contact-main">
    <section>
      <h2>Contact Us</h2>
      <p>Have a project or question? Send us a message.</p>
      <form class="contact-form" action="mailto:you@example.com" method="post" enctype="text/plain">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" placeholder="Your name">

        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com">

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" placeholder="Tell us about your project"></textarea>

        <button class="btn" type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2025 Creative Studio</p>
    </div>
  </footer>
</body>
</html>
